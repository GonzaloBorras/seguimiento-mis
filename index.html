<style>
  html, body, #map { height: 100%; margin: 0; font-family: Arial, Helvetica, sans-serif; }

  /* --- KPI siempre visible --- */
  .kpi-bar {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1000;
    background: #fff; padding: 6px 14px; border-radius: 20px;
    box-shadow: 0 1px 5px rgba(0,0,0,.35); font-size: 13px; white-space: nowrap;
    max-width: 94%; overflow: hidden; text-overflow: ellipsis;
  }
  .kpi-bar .v { color: #16a34a; font-weight: bold; }
  .kpi-bar .p { color: #dc2626; font-weight: bold; }
  .kpi-bar .r { color: #f97316; font-weight: bold; }

  /* --- Panel de filtros --- */
  .panel {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    background: #fff; padding: 8px 10px; border-radius: 8px;
    box-shadow: 0 1px 5px rgba(0,0,0,.35); width: 250px;
    max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); overflow-y: auto;
  }
  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    font-weight: bold; font-size: 12px; margin-bottom: 4px;
  }
  #btnPanel {
    border: none; background: #eee; border-radius: 4px;
    width: 20px; height: 20px; cursor: pointer; font-size: 13px; line-height: 1; color: #333;
  }
  #btnPanel:hover { background: #ddd; }
  .panel select, .panel input[type=text] {
    width: 100%; padding: 4px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px;
    box-sizing: border-box; margin-bottom: 4px;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 6px; }
  .lbl, .grid2 label { font-size: 11px; color: #555; display: block; margin-bottom: 2px; }
  .grid2 select { margin-bottom: 5px; }
  .busca-row { position: relative; margin-bottom: 4px; }
  .busca-row input { margin-bottom: 0; padding-right: 24px; }
  .busca-row button {
    position: absolute; right: 3px; top: 3px; border: none; background: transparent;
    cursor: pointer; font-size: 13px; color: #888;
  }
  .btn-row { display: flex; gap: 5px; margin-top: 2px; }
  .btn-row button {
    flex: 1; padding: 4px; font-size: 11px; border: 1px solid #ccc;
    border-radius: 4px; background: #f3f4f6; cursor: pointer; color: #333;
  }
  .btn-row button:hover { background: #e5e7eb; }
  .stats { margin-top: 6px; font-size: 12px; line-height: 1.55; max-height: 25vh; overflow-y: auto; }
  .stats .k { font-weight: bold; }
  .verde { color: #16a34a; } .rojo { color: #dc2626; }

  /* --- Leyenda --- */
  .legend {
    position: absolute; bottom: 25px; left: 12px; z-index: 1000;
    background: #fff; padding: 8px 10px; border-radius: 8px;
    box-shadow: 0 1px 5px rgba(0,0,0,.35); font-size: 13px;
  }

  /* --- Lista lateral --- */
  .lista {
    position: absolute; top: 60px; right: 12px; z-index: 1000; width: 300px; max-width: calc(100vw - 24px);
    background: #fff; border-radius: 8px; box-shadow: 0 1px 5px rgba(0,0,0,.35);
    display: none; font-size: 13px; max-height: calc(100vh - 80px);
  }
  .lista .head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; font-weight: bold; border-bottom: 1px solid #eee;
  }
  .lista .head button { border: none; background: #eee; border-radius: 4px; cursor: pointer; }
  #listaBody { overflow-y: auto; max-height: calc(100vh - 130px); padding: 4px 0; }
  #listaBody .item { padding: 7px 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
  #listaBody .item:hover { background: #f5f5f5; }
  #listaBody .sub { color: #666; font-size: 12px; }

  /* --- Responsive --- */
  @media (max-width: 700px) {
    .panel { top: 52px; left: 8px; width: calc(100vw - 16px); max-width: calc(100vw - 16px); }
    .kpi-bar { top: 10px; font-size: 12px; padding: 4px 10px; }
    .legend { display: none; }
    .lista { top: 100px; right: 8px; width: calc(100vw - 16px); }
  }

  /* --- Modo oscuro --- */
  body.oscuro .kpi-bar, body.oscuro .panel, body.oscuro .legend, body.oscuro .lista { background: #1f2937; color: #eee; box-shadow: 0 1px 5px rgba(0,0,0,.6); }
  body.oscuro .panel select, body.oscuro .panel input[type=text] { background: #111827; color: #eee; border-color: #374151; }
  body.oscuro .lbl, body.oscuro .grid2 label { color: #9ca3af; }
  body.oscuro #btnPanel, body.oscuro .btn-row button { background: #374151; color: #eee; border-color: #4b5563; }
  body.oscuro .btn-row button:hover { background: #4b5563; }
  body.oscuro .lista .head { border-color: #374151; }
  body.oscuro #listaBody .item { border-color: #2b3441; }
  body.oscuro #listaBody .item:hover { background: #2b3441; }
  body.oscuro #listaBody .sub { color: #9ca3af; }
  body.oscuro .leaflet-popup-content-wrapper, body.oscuro .leaflet-popup-tip { background: #1f2937; color: #eee; }
  body.oscuro .leaflet-popup-content a { color: #93c5fd; }
  body.oscuro .leaflet-control-layers, body.oscuro .leaflet-bar a { background: #1f2937; color: #eee; }
  body.oscuro .leaflet-control-layers-expanded { background: #1f2937; color: #eee; }
</style>
</head>

var markers = [];

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

var map = L.map('map').setView([-26.82, -65.22], 12);

var baseLayers = {
  'Claro': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO'
  }),
  'Satélite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '&copy; Esri &copy; Maxar, Earthstar Geographics'
  }),
  'Callejero': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }),
  'Oscuro': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO'
  })
};
baseLayers['Claro'].addTo(map);
L.control.layers(baseLayers, null, { position: 'topright' }).addTo(map);
map.on('baselayerchange', function(e){
  document.body.classList.toggle('oscuro', e.name === 'Oscuro');
});

var group = L.markerClusterGroup({
  maxClusterRadius: 40,
  disableClusteringAtZoom: 15,
  showCoverageOnHover: false,
  chunkedLoading: true
});
group.addTo(map);

DATOS.forEach(function(d, i){
  var color = d[9] ? '#f97316' : (d[7] ? '#16a34a' : '#dc2626');
  var m = L.circleMarker([d[0], d[1]], {
    radius: d[9] ? 6 : 5, color: color, weight: 1.2,
    fill: true, fillColor: color, fillOpacity: .8
  });
  var estadoText = d[7] ? 'VISITADO' + (d[8] > 1 ? ' (' + d[8] + ' visitas)' : '') : 'PENDIENTE';
  var h = '<b style="color:' + (d[7] ? '#16a34a' : '#dc2626') + '">' + estadoText + '</b><br>';
  if (d[9]) h += '<b style="color:#f97316">&#9888; A REVISAR (geolocalizaci&#243;n dudosa)</b><br>';
  h += '<b>' + esc(d[2]) + '</b><br>';
  h += 'ID: ' + esc(d[11]) + '<br>';
  h += 'Direcci&#243;n: ' + esc(d[3]) + '<br>';
  h += 'Vendedor: ' + esc(d[4]) + '<br>';
  h += 'Localidad: ' + esc(d[5]) + '<br>';
  h += 'Canal: ' + esc(d[6]) + '<br>';
  if (d[10]) h += '&#218;ltima visita: ' + esc(d[10]) + '<br>';
  h += '<a href="https://www.google.com/maps/dir/?api=1&destination=' + d[0] + ',' + d[1] +
       '" target="_blank" rel="noopener">C&#243;mo llegar</a> &nbsp;|&nbsp; ' +
       '<a href="#" onclick="copiarDir(' + i + ');return false;">Copiar datos</a>';
  m.bindPopup(h);
  markers.push(m);
});

function copiarDir(i){
  var t = DATOS[i][2] + ' - ' + DATOS[i][3] + ' (' + DATOS[i][4] + ')';
  function ok(){ prompt('Copiado (Ctrl+C):', t); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(ok, ok);
  } else { ok(); }
}

var selVendedor = document.getElementById('selVendedor');
var selLocalidad = document.getElementById('selLocalidad');
var selCanal = document.getElementById('selCanal');
var selEstado = document.getElementById('selEstado');
var busqueda = document.getElementById('busqueda');
var stats = document.getElementById('stats');
var kpiBar = document.getElementById('kpiBar');
var listaVisible = false;

function coincide(d){
  var v = selVendedor.value, l = selLocalidad.value, c = selCanal.value, e = selEstado.value;
  if (v !== 'ALL' && d[4] !== v) return false;
  if (l !== 'ALL' && d[5] !== l) return false;
  if (c !== 'ALL' && d[6] !== c) return false;
  if (e === 'VIS' && !d[7]) return false;
  if (e === 'PEND' && d[7]) return false;
  if (e === 'REV' && !d[9]) return false;
  var q = busqueda.value.trim().toLowerCase();
  if (q) {
    if ((d[2] + ' ' + d[3] + ' ' + d[11]).toLowerCase().indexOf(q) === -1) return false;
  }
  return true;
}

function aplicarFiltro(encuadrar){
  group.clearLayers();
  var visibles = [];
  DATOS.forEach(function(d, i){
    if (coincide(d)) { visibles.push(i); group.addLayer(markers[i]); }
  });
  var fv = 0, fp = 0, fr = 0, fvis = 0;
  visibles.forEach(function(i){
    var d = DATOS[i];
    fvis += d[8];
    if (d[9]) fr++;
    if (d[7]) fv++; else fp++;
  });
  var pct = visibles.length ? (fv / visibles.length * 100).toFixed(1) : 0;
  stats.innerHTML =
    '<span class="k">Asignados:</span> ' + visibles.length + '<br>' +
    '<span class="k">Visitados:</span> <span class="verde">' + fv + '</span> (' + fvis + ' visitas)<br>' +
    '<span class="k">Pendientes:</span> <span class="rojo">' + fp + '</span><br>' +
    '<span class="k">A revisar:</span> <span style="color:#f97316">' + fr + '</span><br>' +
    '<span class="k">Avance:</span> ' + pct + '%';
  kpiBar.innerHTML =
    'Pendientes: <span class="p">' + fp + '</span> &nbsp;|&nbsp; Visitados: <span class="v">' + fv +
    '</span> &nbsp;|&nbsp; Avance: ' + pct + '%' +
    (fr ? ' &nbsp;|&nbsp; A revisar: <span class="r">' + fr + '</span>' : '');
  actualizarLista();
  if (encuadrar && visibles.length > 0) {
    map.fitBounds(group.getBounds(), { maxZoom: 14, padding: [30, 30] });
  }
}

function actualizarLista(){
  if (!listaVisible) return;
  var items = [];
  DATOS.forEach(function(d, i){ if (coincide(d)) items.push(i); });
  var cont = document.getElementById('listaBody');
  document.getElementById('listaTitulo').textContent = items.length + ' PDV';
  if (items.length > 150) {
    cont.innerHTML = '<div style="padding:10px;color:#666">' + items.length +
      ' PDV coinciden (demasiados para listar). Ajust&#225; los filtros o us&#225; el buscador.</div>';
    return;
  }
  items.sort(function(a, b){ return DATOS[a][2].localeCompare(DATOS[b][2]); });
  var html = '';
  items.forEach(function(i){
    var d = DATOS[i];
    var col = d[9] ? '#f97316' : (d[7] ? '#16a34a' : '#dc2626');
    html += '<div class="item" onclick="irA(' + i + ')">' +
      '<div style="color:' + col + '">' + esc(d[2]) + '</div>' +
      '<div class="sub">' + esc(d[3]) + '</div>' +
      '<div class="sub">' + esc(d[4]) + ' &middot; ' + esc(d[5]) + (d[7] ? ' &middot; &#10003;' : '') + '</div>' +
      '</div>';
  });
  cont.innerHTML = html;
}

function irA(i){
  map.setView([DATOS[i][0], DATOS[i][1]], 16);
  markers[i].openPopup();
}

function reset(){
  selVendedor.value = 'ALL'; selLocalidad.value = 'ALL'; selCanal.value = 'ALL'; selEstado.value = 'ALL';
  busqueda.value = '';
  aplicarFiltro(true);
}

var debounce = null;
busqueda.addEventListener('input', function(){
  clearTimeout(debounce);
  debounce = setTimeout(function(){ aplicarFiltro(false); }, 250);
});
busqueda.addEventListener('keydown', function(e){ if (e.key === 'Enter') aplicarFiltro(true); });
document.getElementById('btnLimpiarBusqueda').addEventListener('click', function(){ busqueda.value = ''; aplicarFiltro(true); });
selVendedor.addEventListener('change', function(){ aplicarFiltro(true); });
selLocalidad.addEventListener('change', function(){ aplicarFiltro(true); });
selCanal.addEventListener('change', function(){ aplicarFiltro(true); });
selEstado.addEventListener('change', function(){ aplicarFiltro(true); });
document.getElementById('btnReset').addEventListener('click', reset);
document.getElementById('btnPanel').addEventListener('click', function(){
  var body = document.getElementById('panelBody');
  var btn = document.getElementById('btnPanel');
  if (body.style.display === 'none') { body.style.display = 'block'; btn.innerHTML = '−'; }
  else { body.style.display = 'none'; btn.innerHTML = '+'; }
});
document.getElementById('btnLista').addEventListener('click', function(){
  var cont = document.getElementById('listaBody');
  listaVisible = !listaVisible;
  if (listaVisible) {
    document.querySelector('.lista').style.display = 'block';
    actualizarLista();
  } else {
    document.querySelector('.lista').style.display = 'none';
  }
});
document.getElementById('btnCerrarLista').addEventListener('click', function(){
  listaVisible = false;
  document.querySelector('.lista').style.display = 'none';
});

aplicarFiltro(true);
</script>
